<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#050816">
    <meta name="description" content="پورتفولیو شخصی ابوالفضل، برنامه‌نویس پایتون و علاقه‌مند به امنیت سایبری">
    <title>ابوالفضل | CyberOps Portfolio</title>

    <style>
        :root {
            --bg: #050816;
            --panel: rgba(10, 19, 40, 0.88);
            --panel-light: #101c38;
            --cyan: #22d3ee;
            --blue: #38bdf8;
            --green: #22c55e;
            --danger: #ef4444;
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(34, 211, 238, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--panel);
            border: 1px solid rgba(34, 211, 238, 0.2);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(34, 211, 238, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
        }

        /* بخش پروفایل و عکس حرفه‌ای */
        .profile-container {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 20px auto;
        }

        .profile-glow {
            position: absolute;
            inset: -4px;
            background: linear-gradient(45deg, var(--cyan), var(--blue), var(--green));
            border-radius: 50%;
            z-index: 0;
            animation: rotateGlow 4s linear infinite;
            filter: blur(6px);
            opacity: 0.8;
        }

        @keyframes rotateGlow {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .profile-img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--panel-light);
        }

        header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
            background: linear-gradient(to left, var(--cyan), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--cyan);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .card p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
            margin-bottom: 16px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input[type="text"] {
            flex: 1;
            min-width: 200px;
            background: var(--bg);
            border: 1px solid rgba(34, 211, 238, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.2);
        }

        button.action-btn {
            background: linear-gradient(135deg, var(--cyan), var(--blue));
            color: #050816;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button.action-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            display: none;
        }

        .result-box.safe {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--green);
            color: var(--green);
            display: block;
        }

        .result-box.danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            display: block;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر و پروفایل -->
        <header>
            <div class="profile-container">
                <div class="profile-glow"></div>
                <img src="IMG_0543.webp" alt="ابوالفضل" class="profile-img">
            </div>
            <h1>ابوالفضل | CyberOps</h1>
            <p>برنامه‌نویس پایتون و علاقه‌مند به امنیت سایبری و تست نفوذ وب</p>
        </header>

        <!-- ابزار امنیتی بررسی لینک -->
        <div class="card">
            <h2>🛡️ ابزار تست امنیت و فیشینگ لینک</h2>
            <p>یک لینک مشکوک (مثل اینترنت رایگان دروغین) وارد کنید تا از نظر ساختاری بررسی شود:</p>
            <div class="input-group">
                <input type="text" id="urlInput" placeholder="https://example.com/free-internet">
                <button class="action-btn" onclick="checkUrl()">بررسی لینک</button>
            </div>
            <div id="urlResult" class="result-box"></div>
        </div>
    </div>

    <footer>
        <p>&copy; 1405 | طراحی شده توسط ابوالفضل</p>
    </footer>

    <script>
        function checkUrl() {
            const input = document.getElementById('urlInput').value.trim();
            const resultBox = document.getElementById('urlResult');
            
            if (!input) {
                resultBox.className = 'result-box danger';
                resultBox.innerText = 'لطفاً یک آدرس معتبر وارد کنید.';
                return;
            }

            // بررسی‌های امنیتی ساده فرانت‌اند
            const suspiciousPatterns = ['free', 'gift', 'login-', 'update-', 'verify', 'support', 'auth', 'win', 'wallet', 't.me/+', 'iran-net'];
            let isSuspicious = false;

            try {
                const urlObj = new URL(input.startsWith('http') ? input : 'https://' + input);
                
                // چک کردن کلمات مشکوک در دامنه یا مسیر
                const fullUrl = urlObj.href.toLowerCase();
                for (let pattern of suspiciousPatterns) {
                    if (fullUrl.includes(pattern) && !fullUrl.includes('google.com') && !fullUrl.includes('github.com')) {
                        isSuspicious = true;
                        break;
                    }
                }

                if (isSuspicious) {
                    resultBox.className = 'result-box danger';
                    resultBox.innerHTML = `⚠️ <strong>هشدار امنیتی:</strong> این لینک حاوی کلمات کلیدی مشکوک به فیشینگ یا کلاهبرداری است! مراقب باشید اطلاعات خود را وارد نکنید.`;
                } else {
                    resultBox.className = 'result-box safe';
                    resultBox.innerHTML = `✅ <strong>ظاهراً امن:</strong> الگوهای خطرناک شناخته‌شده‌ای در ساختار این لینک یافت نشد (با این حال همیشه احتیاط کنید).`;
                }

            } catch (e) {
                resultBox.className = 'result-box danger';
                resultBox.innerText = 'فرمت لینک وارد شده اشتباه است.';
            }
        }
    </script>
</body>
</html>
